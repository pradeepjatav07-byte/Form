<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         
        * {
            margin-top: 0;
            padding: 0;
            box-sizing: border-box;
        
        }
        body{
            height: 100vh;
            justify-content: center;
            display: flex;
            align-items: center;
            background:linear-gradient(90deg, antiquewhite, blueviolet);
        }
        form{
            height: 80%;
            width: 30%;
            border-radius: 10px;
            background-color: white;
        }
        .basic, .email, .password,.button{
            width: 90%;
            margin: auto;
            /* border: 1px solid black; */
        
        }
        .email, .password,.button,h1{
            height: 13.5%;
        }
        input{
            margin-top: 3%;
            
        }
        .basic{
            height: 30%;
        }
        button{
            width: 100%;
            height: 50%;
            background: linear-gradient(90deg , skyblue, purple);
            color: white;
            border: none;
            border-radius: 10px;
            margin-top: 5%;
            margin-bottom: 5%;

        }
        a{
            text-decoration: none;
            font-style: italic;
        }
        .button{
            text-align: center;
        }
        h1{
            line-height:350%;
        }
    </style>
</head>
<body>
   <form action="">
        <h1 align="center">Sign up</h1>
        <div class="basic">
            <label for="">First Name:</label>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <input type="text" name="" id="" required><br>
            <label for="">Last Name:</label>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <input type="text" name="" id="" required><br>
            <label for="">Gender:</label> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <input type="radio" name="gender" >Male &nbsp;&nbsp;&nbsp;&nbsp;
            <input type="radio" name="gender">Female <br>
            <label for="">Date of Birth</label>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <input type="Date" name="" id=""><br>
            <label for="">Mobile No.</label>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <input type="tel" name="" id=""><br>
        </div>
        <div class="email">
            <label for="">Email:</label>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <input type="email" name="" id=""><br>
            <label for="">Conform Email:</label>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;      
            <input type="email" name="" id=""><br>
        </div>
        <div class="password">
            <label for="">Password:</label> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <input type="password" name="" id=""><br>
            <label for="">Conform Password:</label>
            <input type="password" name="" id=""><br>
        </div>
        <div class="button">
            <input type="checkbox" name="" id="">Terms & Conditions <br>
            <button>Sign up</button>
            <p>Already a Member ? <a href="index.html">Log In</a></p>
        </div>
    </form>
    
</body>
</html>
